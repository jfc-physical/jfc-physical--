<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;background:#070A11}
  body{margin:0;min-height:100%;min-height:100dvh;background:#070A11;display:flex;align-items:center;justify-content:center;
    padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    color:#E9EFF9}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:20px;max-width:340px;width:100%;
    opacity:0;transform:translateY(10px);animation:in .55s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes in{to{opacity:1;transform:none}}
  .mark{width:120px;height:120px;border-radius:28px;object-fit:cover;
    box-shadow:0 10px 40px rgba(91,147,232,.35),0 2px 10px rgba(0,0,0,.5);
    animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  .tag{text-align:center}
  .tag b{display:block;font-size:16px;font-weight:800;letter-spacing:.02em}
  .tag span{display:block;margin-top:6px;font-size:11.5px;color:#9AA9C0;letter-spacing:.06em}

  .howto{margin-top:6px;width:100%;background:#111826;border:1px solid #1E2A3F;border-radius:16px;padding:16px 18px;display:none}
  .howto.show{display:block}
  .howto b{display:block;font-size:13px;font-weight:800;margin-bottom:10px}
  .step{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#C7D2E3;line-height:1.5;margin-top:8px}
  .step .n{flex:0 0 auto;width:20px;height:20px;border-radius:99px;background:#1E2A3F;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#9AA9C0}

  .enter{margin-top:2px;width:100%;padding:14px;border-radius:14px;border:none;
    background:linear-gradient(100deg,#5B93E8,#F2606F);color:#fff;font-weight:800;font-size:14px;
    display:none;text-align:center;text-decoration:none}
  .enter.show{display:block}
  .enter.alt{background:#111826;border:1px solid #1E2A3F;color:#C7D2E3;font-weight:700;font-size:13px;padding:12px}
  .hint{font-size:11px;color:#7C8AA0;text-align:center;line-height:1.6;display:none}
  .hint.show{display:block}
</style>
</head>
